<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>LegacyHQ design system tools: architecture</title>
  <desc>Repo data (contracts, examples, DTCG tokens, governance, icons) is generated into registry.json and exemplars.json and read by one query library. The legacyhq CLI and the MCP server are thin wrappers over that library, used by people and by coding agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c534a"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <text x="20" y="30" font-size="12" font-weight="600" fill="#5c534a" letter-spacing="0.06em">SOURCES IN THE REPO</text>
  <g fill="#f4f1ed" stroke="#c9c0b6">
    <rect x="20" y="44" width="200" height="52" rx="6"/>
    <rect x="20" y="106" width="200" height="52" rx="6"/>
    <rect x="20" y="168" width="200" height="52" rx="6"/>
    <rect x="20" y="230" width="200" height="52" rx="6"/>
    <rect x="20" y="292" width="200" height="52" rx="6"/>
  </g>
  <g fill="#2b2622">
    <text x="32" y="66" font-weight="600">Component contracts</text>
    <text x="32" y="84" fill="#5c534a">58 × .contract.json</text>
    <text x="32" y="128" font-weight="600">Usage examples</text>
    <text x="32" y="146" fill="#5c534a">58 × .examples.json</text>
    <text x="32" y="190" font-weight="600">Design tokens</text>
    <text x="32" y="208" fill="#5c534a">DTCG sources + css-recipes.json</text>
    <text x="32" y="252" font-weight="600">Governance rules</text>
    <text x="32" y="270" fill="#5c534a">token + component API JSON</text>
    <text x="32" y="314" font-weight="600">Icons</text>
    <text x="32" y="332" fill="#5c534a">icons.json metadata</text>
  </g>

  <text x="270" y="30" font-size="12" font-weight="600" fill="#5c534a" letter-spacing="0.06em">GENERATED</text>
  <g fill="#f4f1ed" stroke="#c9c0b6">
    <rect x="270" y="44" width="170" height="52" rx="6"/>
    <rect x="270" y="106" width="170" height="52" rx="6"/>
  </g>
  <text x="282" y="66" font-weight="600" fill="#2b2622">registry.json</text>
  <text x="282" y="84" fill="#5c534a">normalized index</text>
  <text x="282" y="128" font-weight="600" fill="#2b2622">exemplars.json</text>
  <text x="282" y="146" fill="#5c534a">examples + anti-examples</text>

  <g stroke="#5c534a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M220,70 H266"/>
    <path d="M220,132 H266"/>
  </g>

  <rect x="490" y="44" width="160" height="300" rx="8" fill="#2b2622"/>
  <text x="570" y="180" text-anchor="middle" font-weight="600" fill="#ffffff" font-size="15">Query library</text>
  <text x="570" y="200" text-anchor="middle" fill="#d9d1c8">packages/tools/query</text>
  <text x="570" y="226" text-anchor="middle" fill="#d9d1c8">read-only · no network</text>
  <text x="570" y="244" text-anchor="middle" fill="#d9d1c8">freshness + doctor checks</text>

  <g stroke="#5c534a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M440,70 H486"/>
    <path d="M440,132 H486"/>
    <path d="M220,194 H486"/>
    <path d="M220,256 H486"/>
    <path d="M220,318 H486"/>
  </g>

  <g fill="#f4f1ed" stroke="#c9c0b6">
    <rect x="700" y="84" width="160" height="70" rx="6"/>
    <rect x="700" y="234" width="160" height="70" rx="6"/>
  </g>
  <text x="712" y="108" font-weight="600" fill="#2b2622">legacyhq CLI</text>
  <text x="712" y="126" fill="#5c534a">npm run -s ds --</text>
  <text x="712" y="144" fill="#5c534a">text or --json</text>
  <text x="712" y="258" font-weight="600" fill="#2b2622">MCP server</text>
  <text x="712" y="276" fill="#5c534a">stdio · 8 tools</text>
  <text x="712" y="294" fill="#5c534a">registered in .mcp.json</text>

  <g stroke="#5c534a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M650,140 C675,140 675,119 696,119"/>
    <path d="M650,250 C675,250 675,269 696,269"/>
  </g>

  <text x="780" y="186" text-anchor="middle" fill="#5c534a">same JSON result</text>
  <text x="780" y="202" text-anchor="middle" fill="#5c534a">(parity-tested)</text>

  <text x="20" y="388" fill="#5c534a">People and coding agents query the tools; CLAUDE.md, llms.txt, and the Storybook docs stay the primary guidance.</text>
  <text x="20" y="406" fill="#5c534a">Not served by the tools today: pattern pages and each component's "when to use" prose.</text>
</svg>
